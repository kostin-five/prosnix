openapi: 3.1.0
info:
  title: Adaptive Wake Coach — расписание пробуждения
  version: 0.2.0
paths:
  /internal/notifications/dispatch:
    post:
      summary: Запустить ограниченную обработку наступивших Telegram-напоминаний
      security: [{ cronBearer: [] }]
      responses:
        "200":
          description: Сводка обработки; повторный вызов безопасен благодаря журналу доставок
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DispatchSummary" }
        "401": { description: Bearer-секрет отсутствует или неверен }
        "503": { description: CRON_SECRET или URL Mini App ещё не настроен на API }
  /api/v1/me/wake-schedule:
    get:
      summary: Получить расписание текущего пользователя
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: Расписание или null
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WakeScheduleEnvelope" }
        "401": { description: Нет подтверждённой сессии }
    put:
      summary: Создать, изменить или выключить ежедневное расписание
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WakeScheduleInput" }
      responses:
        "200":
          description: Сохранённое расписание
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WakeSchedule" }
        "400": { description: Некорректное время или timezone }
        "401": { description: Нет подтверждённой сессии }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: awc_session
    cronBearer:
      type: http
      scheme: bearer
  schemas:
    WakeScheduleInput:
      type: object
      additionalProperties: false
      required: [localTime, timezone, enabled]
      properties:
        localTime: { type: string, pattern: "^(?:[01]\\d|2[0-3]):[0-5]\\d$" }
        timezone: { type: string, minLength: 1, maxLength: 100 }
        enabled: { type: boolean }
    WakeSchedule:
      type: object
      required: [localTime, timezone, enabled, nextTriggerAt, botStatus, revision]
      properties:
        localTime: { type: string }
        timezone: { type: string }
        enabled: { type: boolean }
        nextTriggerAt: { type: [string, "null"], format: date-time }
        botStatus: { type: string, enum: [unknown, available, blocked] }
        revision: { type: integer, minimum: 1 }
    WakeScheduleEnvelope:
      type: object
      required: [schedule]
      properties:
        schedule:
          oneOf:
            - { $ref: "#/components/schemas/WakeSchedule" }
            - { type: "null" }
    DispatchSummary:
      type: object
      additionalProperties: false
      required: [claimed, sent, retryWait, blocked, failed]
      properties:
        claimed: { type: integer, minimum: 0, maximum: 10 }
        sent: { type: integer, minimum: 0 }
        retryWait: { type: integer, minimum: 0 }
        blocked: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
