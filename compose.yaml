services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: awc
      POSTGRES_USER: awc
      POSTGRES_PASSWORD: awc
    ports:
      - "5432:5432"
    volumes:
      - awc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U awc -d awc"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  awc_postgres_data:
